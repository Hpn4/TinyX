---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repo-search
  labels:
    app: tinyx
    module: repo-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinyx
      module: repo-search
  template:
    metadata:
      labels:
        app: tinyx
        module: repo-search
    spec:
      imagePullSecrets:
        - name: tinyx-pull-secret
      containers:
        - name: repo-search
          image: registry.cri.epita.fr/ing/majeures/tc/info/student/2026/2025-epitweet-tinyx-14/repo-search
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: common-env
            - configMapRef:
                name: search-env
            - configMapRef:
                name: repo-search-env
            - secretRef:
                name: tinyx-mongodb-credentials
          env:
            - name: HTTP_PORT
              value: "8081"
          resources:
            limits:
              cpu: "250m" # 0.25 cpu      #Arbitrary values to eventually customize or remove completely
              memory: "128Mi" # 128 Mega  #(These were instored to suppress an IDE warning)
