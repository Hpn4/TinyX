quarkus.http.port=${HTTP_PORT:8090}

quarkus.console.color=true
quarkus.log.console.json=false
quarkus.console.enabled=false


quarkus.neo4j.uri=${NEO4J_CONNECTION_STRING:bolt://${NEO4J_HOST:localhost}:${NEO4J_PORT:7687}}
quarkus.redis.hosts=${REDIS_CONNECTION_STRING:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}

tinyx.redis-stream.trim.every=${TRIM_INTERVAL:10m}
tinyx.redis-stream.claim.every=${CLAIM_INTERVAL:5s}