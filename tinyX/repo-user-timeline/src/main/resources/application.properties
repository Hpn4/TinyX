# DEV
quarkus.http.port=8081

# to make swagger ui look cool
quarkus.swagger-ui.theme=original
quarkus.log.console.json=false
quarkus.console.color=true

quarkus.mongodb.connection-string=mongodb://admin:admin@localhost:27017/\?authSource=Tinyx&retryWrites=true&w=majority&uuidRepresentation=STANDARD
quarkus.mongodb.database=Tinyx
quarkus.redis.hosts=redis://localhost:6379

tinyx.user-timeline.collection=UserTimeline
tinyx.redis-stream.trim.every=10m
tinyx.redis-stream.claim.every=5s
tinyx.rest-client.srvc-post.host=http://localhost:8081
